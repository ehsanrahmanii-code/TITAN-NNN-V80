name: Build Titan NNN V80 APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK (Chaquopy + full libs)
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
      - uses: actions/checkout@v4

      - name: Assemble TITAN source
        run: |
          python3 scripts/assemble_titan.py
          test -f TITAN_PRO_V80_NNN_UNIFIED.py
          ls -lah TITAN_PRO_V80_NNN_UNIFIED.py

      - name: Apply V80.2 real-fix layer
        run: |
          python3 scripts/apply_v80_2_fix.py
          grep -n "V80.2.0-REAL" TITAN_PRO_V80_NNN_UNIFIED.py | head -3
          ls -lah TITAN_PRO_V80_NNN_UNIFIED.py

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Android commandline tools + SDK packages
        run: |
          set -e
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd /tmp
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/tmp/sdk-licenses.txt || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "sdk.dir=$ANDROID_HOME" > "$GITHUB_WORKSPACE/local.properties"

      - name: Prepare Python sources for Chaquopy
        run: |
          mkdir -p app/src/main/python
          cp -f TITAN_PRO_V80_NNN_UNIFIED.py app/src/main/python/
          test -f app/src/main/python/android_main.py
          test -f app/src/main/python/TITAN_PRO_V80_NNN_UNIFIED.py

      - name: Create launcher icons
        run: python3 scripts/make_icons.py

      - name: Setup Gradle wrapper
        run: |
          curl -fsSL -o /tmp/gradle-8.7-bin.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          sudo unzip -qo /tmp/gradle-8.7-bin.zip -d /opt
          /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          chmod +x gradlew

      - name: Gradle assembleDebug
        run: |
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Prepare APK file
        if: success()
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk dist/Titan-NNN-V80.apk
          ls -lah dist/

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Titan-NNN-V80-APK
          path: dist/Titan-NNN-V80.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release (stable download)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v80.2.0-android
          name: Titan NNN V80.2 Real-Fix APK
          body: |
            V80.2 real-fix: real TF scores, unified LONG/SHORT/WAIT, scan progress, NNN storage.
            Grant All-files access when prompted so data writes to Internal Storage/NNN.
          files: dist/Titan-NNN-V80.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
